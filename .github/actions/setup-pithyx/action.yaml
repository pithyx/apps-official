name: Set up pithyx
description: Installs Node.js and the pithyx command of @pithyx/cli.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Install @pithyx/cli
      shell: bash
      run: |
        npm install --global --no-audit --no-fund @pithyx/cli@2.0.0
        pithyx --version
