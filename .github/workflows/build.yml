# Builds app versions from the checked-out commit: the frontend (npm ci and npm run build into dist/, or the folder
# frontend/ as it is) and, for a backend, its images for amd64 and arm64 as OCI archives with pithyx build. This job
# runs the apps' code, so it has no write rights and no secrets; it hands its results to the caller as artifacts.
name: build

on:
  workflow_call:
    inputs:
      apps:
        description: The app versions as JSON, as pithyx catalog pending prints them
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pithyx
      # Each app's results lie in a folder named like its id, so the publish job finds them however many it downloads.
      - name: Build the frontend
        env:
          APP: ${{ matrix.app.path }}
          ID: ${{ matrix.app.id }}
        run: |
          out="$RUNNER_TEMP/out/$ID"
          mkdir -p "$out"
          if [ -f "$APP/package.json" ]; then
            (cd "$APP" && npm ci --no-audit --no-fund && npm run build)
            cp -R "$APP/dist" "$out/frontend"
          else
            cp -R "$APP/frontend" "$out/frontend"
          fi
      - if: matrix.app.backend
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # BuildKit is pinned, so anybody can rebuild an image with the same BuildKit and compare its digest.
      - if: matrix.app.backend
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build the images
        if: matrix.app.backend
        env:
          APP: ${{ matrix.app.path }}
          ID: ${{ matrix.app.id }}
        run: pithyx build "$APP" --oci-out "$RUNNER_TEMP/out/$ID/images"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.app.id }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 3
